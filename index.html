<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Aksara · Perpustakaan Kita</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f0;--card:#fffefb;--g:#2f5d46;--gd:#243d31;--tx:#222;--mut:#6b6f6a;--line:#e3e3dc;--sand:#ede4d4;--gl:#e3ebdd;--warn:#f6e6cf;--wt:#8a5a1c;--red:#f6dcd8;--rt:#a03a2c;--side:#efefe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171a18;--card:#1f2421;--tx:#ecece6;--mut:#9aa09a;--line:#323935;--sand:#2b2f2a;--gl:#2a3a30;--warn:#3d3224;--wt:#e0b377;--red:#43262367;--rt:#f0a094;--side:#1b1f1c;--g:#4f8f6c}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Lora,Georgia,serif;font-weight:400;margin:0}
h1{font-size:34px}h2{font-size:22px}a{color:inherit;text-decoration:none;cursor:pointer}
.app{display:flex;min-height:100vh}.side{width:224px;background:var(--side);padding:20px;display:flex;flex-direction:column;gap:6px;flex:none}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}.logo i{width:36px;height:36px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal}.logo b{font:500 26px Lora,serif}.logo small{display:block;font-size:8px;color:var(--mut);letter-spacing:.5px}
.nl{font-size:11px;color:var(--mut);margin:4px 0}.nav{padding:12px;border-radius:8px;font-weight:500;display:block}.nav.on{background:var(--g);color:#fff}
.quote{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}.quote .serif{color:var(--g);font-size:19px;line-height:1.25}.quote small{color:var(--mut);display:block;margin-top:10px}
.user{margin-top:auto;background:var(--card);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}.av{width:34px;height:34px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-size:12px}
.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;background:var(--card);border-bottom:1px solid var(--line);color:var(--mut)}
.pill{background:var(--gl);color:var(--g);border-radius:99px;padding:4px 10px;font-size:12px;display:inline-block}.pill.w{background:var(--warn);color:var(--wt)}.pill.r{background:var(--red);color:var(--rt)}.pill.n{background:var(--line);color:var(--mut)}
.pg{padding:32px;max-width:1200px}.eb{font-size:11px;letter-spacing:.5px;color:var(--g);text-transform:uppercase;font-weight:600}.sub{color:var(--mut);margin:8px 0 24px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:600 13px Inter;cursor:pointer}.btn.o{background:var(--card);color:var(--g);border:1px solid var(--line)}.btn.d{background:#a03a2c}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:2fr 1fr}.g21{grid-template-columns:1fr 1fr}
.stat small{color:var(--mut)}.stat .serif{font-size:32px;margin:8px 0}
table{width:100%;border-collapse:collapse}th{background:var(--side);text-align:left;font-size:11px;color:var(--mut);letter-spacing:.4px;padding:12px;text-transform:uppercase}td{padding:14px 12px;border-top:1px solid var(--line);color:var(--mut)}td:first-child{color:var(--tx)}.tw{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--card)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font:14px Inter}label{display:block;font-weight:500;margin:14px 0 6px;font-size:13px}
.hero{background:var(--gd);color:#fff;border-radius:12px;display:flex;overflow:hidden;margin:16px 0}.hero div{padding:28px;flex:1}.hero .im,.im{background:linear-gradient(135deg,#5b3a21,#8a5a35 45%,#3e6a48);min-height:200px}.hero h2{font-size:30px;margin:10px 0}
.cv{border-radius:3px;box-shadow:0 6px 14px #0003;color:#fff;font:500 18px/1.1 Lora,serif;padding:10px;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:2/3}.cv small{font:7px Inter;opacity:.8}.cv i{display:block;height:55%;background:#fff3;border-radius:2px}
.bk{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer}.bk .st{background:var(--sand);padding:20px;display:grid;place-items:center}.bk .st .cv{width:46%}.bk .in{padding:14px 4px}.bk small{color:var(--mut);display:block;margin-bottom:6px}
.pop{position:fixed;top:60px;right:24px;width:min(470px,calc(100vw - 32px));z-index:9;box-shadow:0 12px 40px #0004}
.bars{display:flex;align-items:flex-end;gap:10px;height:200px}.bars div{flex:1;background:#a9b9a0;border-radius:3px 3px 0 0;text-align:center;font-size:10px;position:relative}.bars div.l{background:var(--g)}.bars span{position:absolute;top:-16px;left:0;right:0;color:var(--mut)}.bars em{position:absolute;bottom:-20px;left:0;right:0;font-style:normal;color:var(--mut)}
.rk{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.rk b{color:var(--g)}
.bar{height:6px;background:var(--line);border-radius:9px;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--g);border-radius:9px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{padding:11px 16px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:600;color:var(--g);cursor:pointer}.chip.on{background:var(--g);color:#fff}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.auth .l{background:var(--gd);color:#fff;padding:56px}.auth .l h1{font-size:44px;margin:24px 0}.auth .r{padding:64px 12%;align-self:center}.auth .im{border-radius:14px;min-height:300px;margin:28px 0}
.mc{background:var(--gd);color:#fff;border-radius:12px;padding:26px;display:flex;justify-content:space-between;min-height:250px}
.qr{width:106px;height:106px;background:repeating-conic-gradient(#243d31 0 25%,#fff 0 50%) 0 0/16px 16px;border:8px solid #fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.star{color:var(--wt)}
@media(max-width:820px){.app{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;align-items:center;padding:12px}.side .logo{margin:0}.quote,.nl,.user{display:none}.nav{white-space:nowrap}.pg{padding:18px}.top{padding:14px 18px}.g3,.g4,.g2,.g21,.auth,.row2{grid-template-columns:1fr}.hero{flex-direction:column}.auth .l{padding:28px}.auth .r{padding:28px}h1{font-size:28px}.mc{flex-direction:column;gap:14px}}
</style></head><body><div id="root"></div><script>
const B=[
{id:1,t:'Laut Bercerita',a:'Leila S. Chudori',c:'Fiksi',tot:4,av:2,r:4.8,k:'FIK-CHU-017',i:'978-602-424-694-5',bg:'#17384f',n:42,y:304},
{id:2,t:'Filosofi Teras',a:'Henry Manampiring',c:'Pengembangan diri',tot:6,av:4,r:4.7,k:'DIR-MAN-021',i:'978-602-412-518-9',bg:'#c0612f',n:36,y:328},
{id:3,t:'Pulang',a:'Tere Liye',c:'Fiksi',tot:3,av:0,r:4.6,k:'FIK-LIY-032',i:'978-602-082-212-9',bg:'#2b4a3a',n:0,y:0},
{id:4,t:'Atomic Habits',a:'James Clear',c:'Pengembangan diri',tot:5,av:3,r:4.8,k:'DIR-CLE-044',i:'978-602-063-317-6',bg:'#d9c9a0',n:31,y:286},
{id:5,t:'Bumi Manusia',a:'Pramoedya Ananta Toer',c:'Fiksi',tot:4,av:1,r:4.9,k:'FIK-TOE-008',i:'978-979-973-123-4',bg:'#7a3a2c',n:21,y:192},
{id:6,t:'Sapiens',a:'Yuval Noah Harari',c:'Sejarah',tot:4,av:2,r:4.7,k:'SEJ-HAR-056',i:'978-602-424-416-3',bg:'#e5d3b3',n:24,y:218}];
const S={favs:new Set([1,4,5]),pop:true,q:'',cat:'Semua buku',only:false,res:{3:1,5:1},ext:{},edit:1,del:false,ret:false,paid:false,rng:'1 tahun',rev:[['Raka Pratama','07 Oktober 2026',5,'Cerita yang kuat dan menyentuh. Membuat saya melihat arti ingatan dari sudut pandang baru.'],['Sinta Dewi','01 Oktober 2026',4,'Alurnya mengalir, tokohnya terasa dekat. Bacaan yang layak diberi waktu untuk direnungkan.']],stars:4};
const $=s=>document.querySelector(s),cv=b=>`<div class="cv" style="background:${b.bg};${b.bg[1]>'c'||b.bg=='#d9c9a0'||b.bg=='#e5d3b3'?'color:#4a3b22':''}"><div>${b.t}</div><i></i></div>`;
const bar=(v,l)=>{const m=320;return`<div class="${l?'l':''}" style="height:${v/m*100}%"><span>${v}</span><em>${arguments[2]||''}</em></div>`};
const MO=['Okt 25','Nov','Des','Jan 26','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep'],MV=[180,210,195,220,240,260,245,275,290,310,155,320];
const chart=()=>`<div class="bars" style="margin-bottom:28px">${MV.map((v,i)=>`<div class="${i==11?'l':''}" style="height:${v/330*100}%"><span>${v}</span><em>${MO[i]}</em></div>`).join('')}</div>`;
const NAV={m:[['home','Beranda'],['catalog','Katalog buku'],['loans','Pinjaman saya'],['profile','Profil & koleksi']],a:[['a-dash','Dashboard'],['a-books','Manajemen buku'],['a-members','Manajemen anggota'],['a-hist','Histori & denda'],['a-report','Laporan analitik']]};
function shell(role,cur,crumb,body){const m=role=='m',u=m?['Nadia Putri','NP','Anggota · AKS-02418']:['Dimas Santoso','DS','Admin · ADM-001'];
return`<div class="app"><aside class="side"><div class="logo"><i>▤</i><div><b>aksara.</b><small>PERPUSTAKAAN KITA</small></div></div><div class="nl">${m?'RUANG BACA':'RUANG PENGELOLA'}</div>${NAV[role].map(([k,l])=>`<a class="nav ${k==cur?'on':''}" href="#${k}">${l}</a>`).join('')}<div class="quote"><div class="serif">${m?'Satu buku, sejuta kemungkinan.':'Merawat cerita, melayani pembaca.'}</div><small>${m?'Ruang untuk membaca, tempat untuk bertumbuh.':'Data tertata untuk perpustakaan yang bertumbuh.'}</small></div><div class="nl" style="margin-top:auto">Bantuan & panduan · <a href="#login">Keluar</a></div><div class="user" style="margin-top:6px"><div class="av">${u[1]}</div><div><b>${u[0]}</b><br><small style="color:var(--mut)">${u[2]}</small></div></div></aside><div class="main"><div class="top"><span>${crumb}</span><span>Minggu, 11 Oktober 2026 &nbsp; <span class="pill">${m?'Anggota aktif':'Admin'}</span></span></div><div class="pg">${body}</div><div class="pg" style="padding-top:0;color:var(--mut);font-size:11px;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin:0 32px;padding:16px 0">Aksara · Ruang untuk membaca, tempat untuk bertumbuh.<span>Data contoh · 11 Oktober 2026</span></div></div></div>`}
const head=(e,t,s,x='')=>`<div class="hd"><div><div class="eb">${e}</div><h1>${t}</h1><p class="sub">${s}</p></div>${x}</div>`;
const stat=(l,v,s)=>`<div class="card stat"><small>${l}</small><div class="serif">${v}</div><small>${s}</small></div>`;
const avl=b=>`<span class="pill ${b.av?'':'w'}">${b.av}/${b.tot} eksemplar tersedia</span>`;
function card(b){return`<div class="bk" onclick="location.hash='book/${b.id}'"><div class="st">${cv(b)}</div><div class="in"><small style="font-size:10px;margin:0">${b.c.toUpperCase()}</small><h3 style="margin:6px 0;font-size:19px">${b.t}</h3><small>${b.a}</small><small class="star">★ ${b.r} · ${S.favs.has(b.id)?'Favorit Anda':'Ulasan pembaca'}</small>${avl(b)}</div></div>`}
const V={
login(){const a=S.admin;return`<div class="auth"><div class="l">${lg()}<h1>Ruang membaca.<br>Tempat bertumbuh.</h1><p>Temukan cerita, simpan gagasan, dan nikmati perjalanan membaca bersama perpustakaan kita.</p><div class="im"></div><small>1.248 judul pilihan · Satu komunitas pembaca<br>Jl. Cikini Raya No. 18, Jakarta Pusat</small></div><div class="r"><h1>Selamat datang kembali.</h1><p class="sub">Masuk untuk melanjutkan perjalanan membacamu.</p><button class="btn ${a?'o':''}" onclick="S.admin=0;go()">Anggota</button> <button class="btn ${a?'':'o'}" onclick="S.admin=1;go()">Admin / pustakawan</button><p class="sub" style="font-size:12px;margin-top:20px">Akun anggota untuk meminjam dan reservasi. Admin menggunakan akun yang diberikan pengelola.</p><label>Email atau ID anggota</label><input value="${a?'dimas@aksara.id':'nadia.putri@email.com'}"><label>Kata sandi</label><input type="password" value="password1234"><p><label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" checked style="width:auto"> Ingat saya</label></p><button class="btn" onclick="location.hash='${a?'a-dash':'home'}';S.pop=true">Masuk ke Aksara</button><p style="text-align:center"><a href="#register" style="color:var(--g)">Belum punya akun? Daftar anggota</a></p><div class="card" style="background:var(--gl)">Satu akun untuk katalog, pinjaman, kartu digital, dan koleksi favoritmu.</div></div></div>`},
register(){return`<div class="auth"><div class="l">${lg()}<h1>Ruang membaca.<br>Tempat bertumbuh.</h1><div class="im"></div></div><div class="r"><h1>Mulai cerita barumu.</h1><p class="sub">Daftar sebagai anggota dan temukan bacaan yang berarti.</p><label>Nama lengkap</label><input value="Nadia Putri"><div class="row2"><div><label>Nomor telepon</label><input value="0812 3456 7890"></div><div><label>Tanggal lahir</label><input value="18 Mei 1998"></div></div><label>Alamat</label><input value="Jl. Cikini IV No. 12, Jakarta Pusat"><label>Email</label><input value="nadia.putri@email.com"><div class="row2"><div><label>Kata sandi</label><input type="password" value="password1234"></div><div><label>Konfirmasi kata sandi</label><input type="password" value="password1234"></div></div><p class="sub" style="font-size:12px">Minimal 8 karakter, dengan huruf dan angka.</p><label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" checked style="width:auto"> Saya menyetujui syarat keanggotaan dan kebijakan privasi.</label><br><button class="btn" onclick="alert('Pendaftaran dikirim. ID anggota tersedia setelah verifikasi pustakawan.');location.hash='login'">Daftar anggota</button><p style="text-align:center"><a href="#login" style="color:var(--g)">Sudah punya akun? Masuk</a></p></div></div>`},
home(){const L=[[2,'Filosofi Teras','13 Oktober 2026','Rp0','H-2 · 2 hari lagi','w'],[4,'Atomic Habits','18 Oktober 2026','Rp0','Tepat waktu',''],[6,'Sapiens','08 Oktober 2026','Rp3.000','Terlambat 3 hari','r']];
return shell('m','home','Perpustakaan / Beranda',`${S.pop?`<div class="card pop"><div class="eb">🔔 Pengingat pengembalian · H-2 <a style="float:right" onclick="S.pop=0;go()">✕</a></div><h2 style="margin:12px 0">Masih ada 2 hari, Nadia.</h2><p>Filosofi Teras perlu dikembalikan paling lambat 13 Oktober 2026. Kembalikan tepat waktu untuk menghindari denda.</p><div class="card" style="background:var(--warn);padding:12px;color:var(--wt);font-size:13px">Hari ini 11 Oktober 2026 · Sisa 2 hari<br>Denda saat ini Rp0</div><p><button class="btn" onclick="S.pop=0;location.hash='loans'">Lihat pinjaman</button> <button class="btn o" onclick="S.pop=0;go()">Tutup</button></p></div>`:''}${head('Perpustakaan Aksara','Selamat pagi, Nadia.','Ada cerita baru untuk ditemukan. Mari lanjutkan perjalanan membacamu.')}<div class="grid g3">${stat('Buku sedang dipinjam','03','Dari kuota 5 buku')}${stat('Selesai dibaca','12','Sepanjang tahun 2026')}${stat('Koleksi favorit','03','Cerita untuk nanti')}</div><div class="hero"><div><small>PILIHAN PUSTAKAWAN · OKTOBER</small><h2>Cerita berikutnya menunggumu.</h2><p>Dari sastra Indonesia hingga gagasan baru. Temukan bacaan untuk hari-hari yang lebih bermakna.</p><a href="#catalog"><b>Lihat koleksi pilihan →</b></a></div><div class="im"></div></div><div class="grid g2" style="grid-template-columns:1.7fr 1fr"><div class="card"><h2>Sedang kamu baca</h2>${L.map(([i,t,d,f,s,c])=>`<div style="display:flex;gap:14px;align-items:center;padding:14px 0"><div style="width:42px">${cv(B[i-1])}</div><div style="flex:1"><div class="serif" style="font-size:18px">${t}</div><small style="color:var(--mut)">Tenggat ${d} · Denda ${f}</small></div><span class="pill ${c}">${s}</span></div>`).join('')}<a class="btn o" href="#loans">Lihat semua pinjaman</a></div><div><h2 style="margin-bottom:12px">Untuk rak bacamu</h2><div class="grid g21">${card(B[0])}${card(B[4])}</div></div></div>`)},
catalog(){const l=B.filter(b=>(S.cat=='Semua buku'||b.c==S.cat||(S.cat=='Bisnis & ekonomi'&&0))&&(!S.only||b.av)&&(b.t+b.a+b.i).toLowerCase().includes(S.q.toLowerCase()));
return shell('m','catalog','Perpustakaan / Katalog buku',`${head('Perpustakaan Aksara','Temukan bacaan berikutnya.','Jelajahi 1.248 judul, dari cerita yang dekat hingga ide yang membuka cakrawala.')}<input id="q" placeholder="🔍 Cari judul buku, penulis, atau ISBN..." value="${S.q}" oninput="S.q=this.value;go('q')"><div class="chips">${['Semua buku','Fiksi','Pengembangan diri','Sejarah','Bisnis & ekonomi','Sains & teknologi'].map(c=>`<span class="chip ${c==S.cat?'on':''}" onclick="S.cat='${c}';go()">${c}</span>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>${S.cat} · ${l.length} judul</b><label style="margin:0;font-weight:400"><input type="checkbox" style="width:auto" ${S.only?'checked':''} onchange="S.only=this.checked;go()"> Hanya yang tersedia</label></div><div class="grid g3">${l.map(card).join('')||'<p class="sub">Tidak ada buku yang cocok.</p>'}</div><p class="sub">Menampilkan ${l.length} dari 1.248 judul</p>`)},
book(id){const b=B[id-1],f=S.favs.has(b.id),r=S.res[b.id];
